<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Energy Audit With EnergInAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f5f5f5; padding: 2rem; }
    .form-section { background: white; padding: 2rem; margin-bottom: 2rem; border-radius: 12px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.05); }
    .appliance-table, .appliance-config-table { margin-top: 1rem; }
    .appliance-config-table th, .appliance-config-table td { vertical-align: middle; }
    .remove-btn { color: red; border: none; background: none; cursor: pointer; font-size: 1.2rem; line-height: 1; }
    .room-section { border: 1px solid #ddd; background: #f8f8fb; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
    .required::after { content: "*"; color: red; margin-left: 0.2em; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Smart Energy Audit With EnergInAI</h2>
    <form id="auditForm" novalidate>
      <!-- [ ... All your form HTML remains unchanged ... ] -->
      <!-- COPY EVERYTHING IN YOUR FORM SECTIONS HERE 
           (the body content you posted above; omitted for brevity here) -->
    </form>
  </div>

<script>
/* [ ... All your UI logic functions: addWindowWallRoom, addMonthEntry, addRoom, etc ... ] */
/* Use your existing JavaScript for dynamic form sections; keep as-is unless you want to improve UX. */

document.getElementById('auditForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  if (!form.checkValidity()) {
    form.classList.add('was-validated');
    return;
  }

  // Gather all data from dynamic and static inputs:
  const formData = new FormData(form);
  const output = {};
  formData.forEach((val, key) => {
    if (output[key]) {
      if (!Array.isArray(output[key])) output[key] = [output[key]];
      output[key].push(val);
    } else {
      output[key] = val;
    }
  });

  // ----------- CUSTOM GROUPING FOR ADVANCED BLOCKS ------------
  // 1. Window Wall Ratios
  const windowWallRooms = [];
  document.querySelectorAll('#windowWallRooms > div').forEach(div => {
    windowWallRooms.push({
      room: div.querySelector('select')?.value,
      wallSize: div.querySelector('input[id^="wall_"]')?.value,
      windowSize: div.querySelector('input[id^="window_"]')?.value,
      ratio: div.querySelector('input[id^="wwr_"]')?.value
    });
  });
  output.windowWallRooms = windowWallRooms;

  // 2. Monthly Consumption & Bill
  const monthlyBills = [];
  document.querySelectorAll('#monthlyConsumption > div').forEach(div => {
    monthlyBills.push({
      month: div.querySelector('select')?.value,
      kwh: div.querySelector('input[name$="_kwh"]')?.value,
      bill: div.querySelector('input[name$="_bill"]')?.value
    });
  });
  output.monthlyBills = monthlyBills;
  output.peakBillingMonth = document.getElementById('peakBillingMonth')?.value || '';

  // 3. Appliance Data Per Room
  const applianceRooms = [];
  document.querySelectorAll('.room-section').forEach((roomDiv, index) => {
    const roomSelect = roomDiv.querySelector(`select[name="room${index +1}_type"]`);
    if (!roomSelect || !roomSelect.value) return;
    const roomAreaInput = roomDiv.querySelector(`input[name="room${index +1}_area"]`);
    const roomArea = roomAreaInput ? roomAreaInput.value : "";
    const checkedAppliances = Array.from(roomDiv.querySelectorAll('input[name$="_appliance"]:checked')).map(x => x.value);
    const applianceData = {};
    checkedAppliances.forEach(appKey => {
      const tbody = roomDiv.querySelector(`#applianceRows_${appKey}_${index + 1}`);
      const rows = [];
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(tr => {
          const rowData = {};
          tr.querySelectorAll('input,select').forEach(input => {
            rowData[input.name] = input.value;
          });
          rows.push(rowData);
        });
      }
      applianceData[appKey] = rows;
    });

    applianceRooms.push({
      roomType: roomSelect.value,
      roomArea,
      appliances: checkedAppliances,
      applianceData
    });
  });
  output.applianceRooms = applianceRooms;

  // -------------------------------------------------------------
  // Now send the entire data object as JSON to the backend:
  try {
    const resp = await fetch('/submit-audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(output)
    });
    const result = await resp.json();
    if (result.status === 'success') {
      alert('Audit submitted successfully!');
      form.reset();
      // Clear dynamic sections & reset all counters if needed:
      document.getElementById('windowWallRooms').innerHTML = '';
      document.getElementById('monthlyConsumption').innerHTML = '';
      document.getElementById('applianceRooms').innerHTML = '';
      document.getElementById('peakBillingMonth').value = '';
      // You can reset your room/window/month counters here if needed
    } else {
      alert('Submission failed.');
    }
  } catch (err) {
    alert('Network/server error: ' + err.message);
  }
});
</script>
</body>
</html>
