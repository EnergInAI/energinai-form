<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Energy Audit With EnergInAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f5f5f5; padding: 2rem; }
    .form-section { background: white; padding: 2rem; margin-bottom: 2rem; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
    .appliance-table, .appliance-config-table { margin-top: 1rem; }
    .appliance-config-table th, .appliance-config-table td { vertical-align: middle; }
    .remove-row-btn { color: red; border: none; background: none; }
    .room-section { padding: 1rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 1.5rem; background: #f8f8fb; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Smart Energy Audit With EnergInAI</h2>
    <form id="auditForm">
      <!-- 1. Basic Information -->
      <div class="form-section">
        <h4>1. Basic Information (House Profile)</h4>
        <div class="mb-3">
          <label for="owner" class="form-label">Name Of House Owner</label>
          <input type="text" class="form-control" id="owner" name="owner" required />
        </div>
        <div class="mb-3">
          <label for="builtUpArea" class="form-label">Built-up area (sq. ft. or sq. m)</label>
          <input type="text" class="form-control" id="builtUpArea" name="builtUpArea" required />
        </div>
        <div class="mb-3">
          <label for="floors" class="form-label">Number of floors</label>
          <input type="number" class="form-control" id="floors" name="floors" required />
        </div>
        <div class="mb-3">
          <label for="constructionYear" class="form-label">Year of construction</label>
          <input type="number" class="form-control" id="constructionYear" name="constructionYear" required />
        </div>
        <div class="mb-3">
          <label for="buildingType" class="form-label">Type of building</label>
          <select class="form-select" id="buildingType" name="buildingType">
            <option>Independent House</option>
            <option>Apartment</option>
            <option>Duplex</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="occupancy" class="form-label">Occupancy</label>
          <input type="text" class="form-control" id="occupancy" name="occupancy" placeholder="e.g., 4 residents, 16 hrs/day" />
        </div>
        <div class="mb-3">
          <label for="climateZone" class="form-label">Climate Zone (per BEE)</label>
          <select class="form-select" id="climateZone" name="climateZone">
            <option>Hot and Dry</option>
            <option>Warm and Humid</option>
            <option>Moderate</option>
            <option>Cold</option>
            <option>Composite</option>
          </select>
        </div>
      </div>

      <!-- 2. Building Envelope -->
      <div class="form-section">
        <h4>2. Building Envelope Assessment</h4>
        <div class="mb-3">
          <label class="form-label">Wall type and insulation</label>
          <input type="text" class="form-control" name="wallInsulation" />
        </div>
        <div class="mb-3">
          <label class="form-label">Roof type and insulation</label>
          <input type="text" class="form-control" name="roofInsulation" />
        </div>
        <div class="mb-3">
          <label class="form-label">Window type</label>
          <select class="form-select" name="windowType">
            <option>Single-glazed</option>
            <option>Double-glazed</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Window-to-wall ratio</label>
          <input type="text" class="form-control" name="windowWallRatio" />
        </div>
        <div class="mb-3">
          <label class="form-label">Presence of shading</label>
          <input type="text" class="form-control" name="shading" />
        </div>
      </div>

      <!-- 3. Energy Consumption -->
      <div class="form-section">
        <h4>3. Energy Consumption Overview</h4>
        <div class="mb-3">
          <label class="form-label">Monthly kWh consumed (average)</label>
          <input type="number" class="form-control" name="monthlyKwh" />
        </div>
        <div class="mb-3">
          <label class="form-label">Monthly ₹ paid (average)</label>
          <input type="number" class="form-control" name="monthlyBill" />
        </div>
        <div class="mb-3">
          <label class="form-label">Meter Type</label>
          <select class="form-select" name="meterType">
            <option>Single Phase</option>
            <option>Three Phase</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Net Metering Present?</label>
          <select class="form-select" name="netMetering">
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Tariff Slabs</label>
          <input type="text" class="form-control" name="tariff" />
        </div>
        <div class="mb-3">
          <label class="form-label">Peak Billing Months</label>
          <input type="text" class="form-control" name="peakMonths" />
        </div>
      </div>

      <!-- 4. Solar Feasibility -->
      <div class="form-section">
        <h4>4. Solar Feasibility Assessment</h4>
        <div class="mb-3">
          <label class="form-label">Existing Solar System?</label>
          <select class="form-select" name="solarExists">
            <option>No</option>
            <option>Yes</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Available Roof Area (sq. m)</label>
          <input type="number" class="form-control" name="roofArea" />
        </div>
        <div class="mb-3">
          <label class="form-label">Shadow Analysis</label>
          <input type="text" class="form-control" name="shadowAnalysis" />
        </div>
        <div class="mb-3">
          <label class="form-label">Roof Orientation</label>
          <input type="text" class="form-control" name="roofOrientation" />
        </div>
        <div class="mb-3">
          <label class="form-label">Electric Panel Capacity (kW)</label>
          <input type="number" class="form-control" name="panelCapacity" />
        </div>
      </div>

      <!-- 5. Appliance Data (Per Room) -->
      <div class="form-section">
        <h4>5. Appliance Data (Per Room)</h4>
        <div id="applianceRooms"></div>
        <button type="button" class="btn btn-secondary" onclick="addRoom()">Add Room</button>
      </div>

      <!-- 6. Behavioral and Operational Aspects -->
      <div class="form-section">
        <h4>6. Behavioral and Operational Aspects</h4>
        <div class="mb-3">
          <label class="form-label">Awareness of energy-saving practices</label>
          <select class="form-select" name="awareness">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Use of energy-saving features</label>
          <select class="form-select" name="energyFeatures">
            <option>Regularly</option>
            <option>Sometimes</option>
            <option>Never</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Control Type</label>
          <select class="form-select" name="controlType">
            <option>Manual</option>
            <option>Automated</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary mb-5">Submit</button>
    </form>
  </div>

<script>
const roomOptions = [
  "Room 1","Room 2","Room 3","Kitchen","Bathroom 1","Bathroom 2","Hall","Others"
];
const applianceList = [
  {key:'ac', label:'Air Conditioner'},
  {key:'refrigerator', label:'Refrigerator'},
  {key:'geyser', label:'Geyser / Water Heater'},
  {key:'washing_machine', label:'Washing Machine'},
  {key:'microwave', label:'Microwave / Cooktop'},
  {key:'fan', label:'Ceiling/Table Fans'},
  {key:'tv', label:'TV'},
  {key:'laptop', label:'Laptop/Computer'},
  {key:'lighting', label:'Lighting Fixtures (LED/CFL/Tube)'},
];
let roomCount = 0;

function addRoom() {
  roomCount++;
  const roomDiv = document.createElement('div');
  roomDiv.classList.add('room-section');
  roomDiv.id = `room-section-${roomCount}`;
  let roomOptionsHtml = roomOptions.map(r => `<option value="${r}">${r}</option>`).join('');
  let applianceCheckboxesHtml = applianceList.map(app =>
    `<div class="form-check form-check-inline mb-2">
      <input class="form-check-input"
        type="checkbox"
        id="appliance-${app.key}-room${roomCount}"
        name="room${roomCount}_appliance"
        value="${app.key}"
        onchange="toggleApplianceConfigTable('${app.key}',${roomCount},this)">
      <label class="form-check-label" for="appliance-${app.key}-room${roomCount}">${app.label}</label>
    </div>`
  ).join(' ');
  roomDiv.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h5 class="mb-0">Room</h5>
      <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRoom(${roomCount})">Remove Room</button>
    </div>
    <div class="mb-2">
      <label class="form-label">Select Room</label>
      <select class="form-select mb-2" name="room${roomCount}_type" required>
        <option value="">-- Select --</option>
        ${roomOptionsHtml}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Select Appliances Present in This Room</label>
      <div>${applianceCheckboxesHtml}</div>
    </div>
    <div id="room${roomCount}_applianceTables"></div>
  `;
  document.getElementById('applianceRooms').appendChild(roomDiv);
}
function removeRoom(roomId) {
  let el = document.getElementById(`room-section-${roomId}`);
  if (el) el.remove();
}
function toggleApplianceConfigTable(appKey, roomId, checkbox) {
  let targetDiv = document.getElementById(`applianceTable_${appKey}_room${roomId}`);
  if (checkbox.checked) {
    if (!targetDiv) {
      let tablesDiv = document.getElementById(`room${roomId}_applianceTables`);
      let tableHtml = buildApplianceTable(appKey, roomId);
      tablesDiv.insertAdjacentHTML('beforeend', tableHtml);
      addApplianceRow(appKey, roomId);
    }
  } else {
    if (targetDiv) targetDiv.remove();
  }
}
function buildApplianceTable(appKey, roomId) {
  let appliance = applianceList.find(a => a.key === appKey);
  return `
    <div id="applianceTable_${appKey}_room${roomId}" class="appliance-table mt-3">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <b>${appliance.label}</b>
        <button class="btn btn-sm btn-outline-success" type="button" onclick="addApplianceRow('${appKey}',${roomId})">+ Add Row</button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered appliance-config-table mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:70px;">Qty</th>
              <th style="width:120px;">Power (W)</th>
              <th>Model/Type</th>
              <th style="width:110px;">Usage Hrs/Day</th>
              <th style="width:120px;">Time Start</th>
              <th style="width:120px;">Time End</th>
              <th style="width:130px;">Age/Condition</th>
              <th style="width:52px;"></th>
            </tr>
          </thead>
          <tbody id="applianceRows_${appKey}_room${roomId}"></tbody>
        </table>
      </div>
    </div>
  `;
}
function addApplianceRow(appKey, roomId) {
  let tbody = document.getElementById(`applianceRows_${appKey}_room${roomId}`);
  let idx = tbody ? tbody.children.length : 0;
  if (!tbody) return;
  let rowHtml = `
    <tr>
      <td><input type="number" min="1" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][qty]" value="1" required></td>
      <td><input type="number" min="1" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][power]" required></td>
      <td><input type="text" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][model]" required></td>
      <td><input type="number" min="0" max="24" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][usagehrs]" required></td>
      <td><input type="time" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][time_start]" required></td>
      <td><input type="time" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][time_end]" required></td>
      <td>
        <select class="form-select form-select-sm" name="room${roomId}_${appKey}[${idx}][age]" required>
          <option>New</option>
          <option>Good</option>
          <option>Average</option>
          <option>Old</option>
          <option>Not Working</option>
        </select>
      </td>
      <td>
        <button type="button" class="remove-row-btn" onclick="this.closest('tr').remove();" title="Remove Row">&times;</button>
      </td>
    </tr>
  `;
  tbody.insertAdjacentHTML('beforeend', rowHtml);
}

// --- FORM SUBMIT (AJAX POST to backend) ---
document.getElementById('auditForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const json = {};
  // Main fields
  formData.forEach((val, key) => {
    if (json[key]) { 
      if (!Array.isArray(json[key])) json[key] = [json[key]]; 
      json[key].push(val); 
    }
    else { json[key] = val; }
  });
  // Appliance rooms + data
  const applianceRooms = [];
  document.querySelectorAll('.room-section').forEach((roomDiv, idx) => {
    const roomSelect = roomDiv.querySelector('select[name^="room"]');
    if (!roomSelect || !roomSelect.value) return;
    const roomType = roomSelect.value;
    const appliances = Array.from(roomDiv.querySelectorAll('input[type=checkbox][name$="_appliance"]:checked')).map(inp => inp.value);
    const appliancesData = {};
    appliances.forEach(appKey => {
      const rows = [];
      const tbody = roomDiv.querySelector(`#applianceRows_${appKey}_room${idx+1}`);
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(tr => {
          const row = {};
          tr.querySelectorAll('input,select').forEach(field => { row[field.name] = field.value; });
          rows.push(row);
        });
      }
      appliancesData[appKey] = rows;
    });
    applianceRooms.push({ roomType, appliances, appliancesData });
  });
  json['applianceRooms'] = applianceRooms;

  // FIXED: Use relative path (not localhost or port!)
  try {
    const resp = await fetch('/submit-audit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(json)
    });
    const result = await resp.json();
    if (result.status === 'success') {
      alert('Audit submitted successfully!');
      form.reset();
      document.getElementById('applianceRooms').innerHTML = '';
    } else { alert('Submission failed.'); }
  } catch (err) { alert('Network/server error: ' + err.message); }
});

// Auto add one room by default on page load
window.onload = function() {
  addRoom();
};
</script>
</body>
</html>
