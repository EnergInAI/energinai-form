<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Energy Audit With EnergInAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f5f5f5;
      padding: 2rem;
    }
    .form-section { background: white; padding: 2rem; margin-bottom: 2rem; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.05);}
    .appliance-table, .appliance-config-table { margin-top: 1rem;}
    .appliance-config-table th, .appliance-config-table td { vertical-align: middle; }
    .remove-btn { color: red; border: none; background: none; cursor: pointer; font-size: 1.2rem; line-height: 1;}
    .room-section { border: 1px solid #ddd; background: #f8f8fb; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;}
    .required::after { content: "*"; color: red; margin-left: 0.2em;}
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Smart Energy Audit With EnergInAI</h2>
    <form id="auditForm" novalidate>
      <!-- .. form structure (exactly as you provided, unchanged for brevity here) ... -->

      <!-- 5. Appliance Data -->
      <section class="form-section">
        <h4>5. Appliance Data</h4>
        <div id="applianceRooms"></div>
        <button type="button" class="btn btn-secondary" onclick="addRoom()">Add Room</button>
      </section>

      <!-- .. rest of form structure ... -->

      <button type="submit" class="btn btn-primary mb-2">Submit</button>
      <button type="button" onclick="downloadCurrentAudit()" class="btn btn-secondary mb-5">Download This Audit (Offline Backup)</button>
    </form>
  </div>

<script>
const roomNames = ["Room 1", "Room 2", "Room 3", "Kitchen", "Bathroom 1", "Bathroom 2", "Hall", "Others"];
const applianceList = [
  { key: "ac", label: "Air Conditioner" },
  { key: "refrigerator", label: "Refrigerator" },
  { key: "geyser", label: "Geyser / Water Heater" },
  { key: "washing_machine", label: "Washing Machine" },
  { key: "microwave", label: "Microwave / Cooktop" },
  { key: "fan", label: "Ceiling/Table Fans" },
  { key: "tv", label: "TV" },
  { key: "laptop", label: "Laptop/Computer" },
  { key: "lighting", label: "Lighting Fixtures (LED/CFL/Tube)" }
];

// Maintain the set of current room numbers (NOT a global increment)
let roomNumbers = [];

function getLowestAvailableRoomNumber() {
  // Find the lowest unused positive integer >=1
  for (let i = 1; i < 100; i++) {
    if (!roomNumbers.includes(i)) return i;
  }
  return roomNumbers.length + 1; // fallback (should never hit)
}

function addRoom(saved) {
  const num = saved?.roomNum || getLowestAvailableRoomNumber();
  roomNumbers.push(num);
  roomNumbers.sort((a,b)=>a-b);
  const container = document.getElementById('applianceRooms');
  const div = document.createElement('div');
  div.className = 'room-section';
  div.id = `room_${num}`;
  let options = `<option value="">Select</option>`;
  // Prevent assigning a room name already used (except restoring)
  const allSelectedRooms = Array.from(document.querySelectorAll('select[name$="_type"]')).map(s => s.value).filter(Boolean);
  const availableRooms = roomNames.filter(r => !allSelectedRooms.includes(r) || (saved && saved.roomType === r));
  options += availableRooms.map(r => `<option>${r}</option>`).join('');
  let appliancesHTML = applianceList.map(app => `
    <div class="form-check form-check-inline">
      <input type="checkbox" class="form-check-input" id="${app.key}_room_${num}" name="room${num}_appliance" value="${app.key}" onchange="toggleAppliance('${app.key}',${num}, this)" />
      <label class="form-check-label" for="${app.key}_room_${num}">${app.label}</label>
    </div>
  `).join('');
  div.innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5>Room ${num}</h5>
      <button type="button" class="btn btn-danger btn-sm" onclick="removeRoom(${num})">Remove</button>
    </div>
    <div class="mb-3">
      <label class="form-label required">Room</label>
      <select name="room${num}_type" class="form-select" required onchange="updateAllRoomSelects()">
        ${options}
      </select>
      <div class="invalid-feedback">Select a room</div>
    </div>
    <div class="mb-3">
      <label class="form-label required">Room Area (m²)</label>
      <input name="room${num}_area" type="number" min="0" step="0.01" class="form-control" placeholder="Enter room area" required />
      <div class="invalid-feedback">Enter room area</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Select Appliances Present</label>
      <div>${appliancesHTML}</div>
    </div>
    <div id="appliances_${num}"></div>
  `;
  container.appendChild(div);

  // Restore data for a saved room, if present (optional)
  if (saved) {
    const selRoom = div.querySelector(`select[name="room${num}_type"]`);
    selRoom.value = saved.roomType || "";
    const roomAreaInput = div.querySelector(`input[name="room${num}_area"]`);
    if(roomAreaInput) roomAreaInput.value = saved.roomArea || "";
    (saved.appliances || []).forEach(appKey => {
      const checkbox = div.querySelector(`input[value="${appKey}"]`);
      if(checkbox) {
        checkbox.checked = true;
        toggleAppliance(appKey, num, checkbox, true, saved.applianceData && saved.applianceData[appKey]);
      }
    });
  }
  updateAllRoomSelects();
}
function removeRoom(num) {
  let el = document.getElementById(`room_${num}`);
  if (el) el.remove();
  // Remove the num from our list
  roomNumbers = roomNumbers.filter(n => n !== num);
  updateAllRoomSelects();
}
function updateAllRoomSelects() {
  const selects = Array.from(document.querySelectorAll('select[name$="_type"]'));
  const selectedRooms = selects.map(s => s.value).filter(Boolean);
  selects.forEach(s => {
    const currentVal = s.value;
    s.querySelectorAll('option').forEach(opt => {
      if(opt.value === '') return;
      opt.disabled = selectedRooms.includes(opt.value) && (opt.value !== currentVal);
    });
  });
}
function toggleAppliance(appKey, roomNum, checkbox, restore = false, savedRows = null) {
  const container = document.getElementById(`appliances_${roomNum}`);
  const existingTable = document.getElementById(`applianceTable_${appKey}_${roomNum}`);
  if (checkbox.checked && !existingTable) {
    const html = buildApplianceTable(appKey, roomNum);
    container.insertAdjacentHTML('beforeend', html);
    addApplianceRow(appKey, roomNum, savedRows && savedRows[0]);
    if (savedRows && savedRows.length > 1) {
      for (let i = 1; i < savedRows.length; i++) addApplianceRow(appKey, roomNum, savedRows[i]);
    }
  } else if (!checkbox.checked && existingTable) {
    existingTable.remove();
  }
}
function buildApplianceTable(appKey, roomNum) {
  const appliance = applianceList.find(a => a.key === appKey);
  return `
    <div class="appliance-table mt-3" id="applianceTable_${appKey}_${roomNum}">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong>${appliance.label}</strong>
        <button type="button" class="btn btn-sm btn-success" onclick="addApplianceRow('${appKey}', ${roomNum})">Add</button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-sm">
          <thead class="table-light">
            <tr>
              <th>Qty</th>
              <th>Rating</th>
              <th>Usage (hrs/day)</th>
              <th>Power (kW)</th>
              <th>Monthly Cost (₹)</th>
              <th>Model</th>
              <th>Condition</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="applianceRows_${appKey}_${roomNum}"></tbody>
        </table>
      </div>
    </div>
  `;
}
function addApplianceRow(appKey, roomNum, saved = null) {
  const tbody = document.querySelector(`#applianceRows_${appKey}_${roomNum}`);
  if (!tbody) return;
  const idx = tbody.children.length;
  const rowHtml = `
    <tr>
      <td><input name="room${roomNum}_${appKey}[${idx}][qty]" type="number" min="1" class="form-control form-control-sm"
        value="${saved?.[`room${roomNum}_${appKey}[${idx}][qty]`] || 1}" required /></td>
      <td><input name="room${roomNum}_${appKey}[${idx}][rating]" type="number" min="1" class="form-control form-control-sm"
        value="${saved?.[`room${roomNum}_${appKey}[${idx}][rating]`] || ''}" required oninput="calcAppliancePower('${appKey}',${roomNum},${idx})" /></td>
      <td><input name="room${roomNum}_${appKey}[${idx}][usage]" type="number" min="0" max="24" step="0.1" class="form-control form-control-sm"
        value="${saved?.[`room${roomNum}_${appKey}[${idx}][usage]`] || ''}" required oninput="calcAppliancePower('${appKey}',${roomNum},${idx})" /></td>
      <td><input name="room${roomNum}_${appKey}[${idx}][power]" type="number" step="0.01" class="form-control form-control-sm" readonly /></td>
      <td><input name="room${roomNum}_${appKey}[${idx}][money]" type="number" min="0" step="0.01" class="form-control form-control-sm"
        value="${saved?.[`room${roomNum}_${appKey}[${idx}][money]`] || ''}" required /></td>
      <td><input name="room${roomNum}_${appKey}[${idx}][model]" type="text" class="form-control form-control-sm"
        value="${saved?.[`room${roomNum}_${appKey}[${idx}][model]`] || ''}" required /></td>
      <td>
        <select name="room${roomNum}_${appKey}[${idx}][condition]" class="form-select form-select-sm" required>
          <option value=''>Select</option>
          <option>New</option><option>Good</option><option>Average</option><option>Old</option><option>Not Working</option>
        </select>
      </td>
      <td><button type="button" class="remove-btn" onclick="this.closest('tr').remove()">&times;</button></td>
    </tr>
  `;
  tbody.insertAdjacentHTML('beforeend', rowHtml);
  calcAppliancePower(appKey, roomNum, idx);
}
function calcAppliancePower(appKey, roomNum, idx) {
  const rating = parseFloat(document.querySelector(`input[name="room${roomNum}_${appKey}[${idx}][rating]"]`)?.value) || 0;
  const usage = parseFloat(document.querySelector(`input[name="room${roomNum}_${appKey}[${idx}][usage]"]`)?.value) || 0;
  const powerInput = document.querySelector(`input[name="room${roomNum}_${appKey}[${idx}][power]"]`);
  if (powerInput) {
    const power = (rating * usage) / 1000;
    powerInput.value = power ? power.toFixed(2) : '';
  }
}

// --------- FORM SUBMIT/AJAX POST TO BACKEND ----------
document.getElementById('auditForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const json = {};
  // Regular fields
  formData.forEach((val, key) => {
    if (json[key]) { if (!Array.isArray(json[key])) json[key] = [json[key]]; json[key].push(val); }
    else { json[key] = val; }
  });
  // Collect appliance rooms
  const applianceRooms = [];
  document.querySelectorAll('.room-section').forEach(roomDiv => {
    // Get the room number from its id (`room_1` etc)
    const numMatch = roomDiv.id.match(/room_(\d+)/);
    const rnum = numMatch ? Number(numMatch[1]) : null;
    if (!rnum) return;
    const roomSelect = roomDiv.querySelector(`select[name="room${rnum}_type"]`);
    if (!roomSelect || !roomSelect.value) return;
    const roomAreaInput = roomDiv.querySelector(`input[name="room${rnum}_area"]`);
    const checkedAppliances = Array.from(roomDiv.querySelectorAll('input[name$="_appliance"]:checked')).map(x => x.value);
    const applianceData = {};
    checkedAppliances.forEach(appKey => {
      const tbody = roomDiv.querySelector(`#applianceRows_${appKey}_${rnum}`);
      const rows = [];
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(tr => {
          const rowData = {};
          tr.querySelectorAll('input,select').forEach(input => {
            rowData[input.name] = input.value;
          });
          rows.push(rowData);
        });
      }
      applianceData[appKey] = rows;
    });
    applianceRooms.push({
      roomType: roomSelect.value,
      roomArea: roomAreaInput ? roomAreaInput.value : "",
      appliances: checkedAppliances,
      applianceData
    });
  });
  json.applianceRooms = applianceRooms;
  try {
    const resp = await fetch('/submit-audit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(json)
    });
    const result = await resp.json();
    if (result.status === 'success') {
      alert('Audit submitted successfully!');
      clearForm();
    } else { alert('Submission failed.'); }
  } catch (err) { alert('Network/server error: ' + err.message); }
});

// --------- OFFLINE DOWNLOAD BUTTON ----------
function downloadCurrentAudit() {
  const json = {};
  const form = document.getElementById('auditForm');
  const formData = new FormData(form);
  formData.forEach((val, key) => {
    if (json[key]) { if (!Array.isArray(json[key])) json[key] = [json[key]]; json[key].push(val); }
    else { json[key] = val; }
  });
  // Collect appliance rooms
  const applianceRooms = [];
  document.querySelectorAll('.room-section').forEach(roomDiv => {
    const numMatch = roomDiv.id.match(/room_(\d+)/);
    const rnum = numMatch ? Number(numMatch[1]) : null;
    if (!rnum) return;
    const roomSelect = roomDiv.querySelector(`select[name="room${rnum}_type"]`);
    if (!roomSelect || !roomSelect.value) return;
    const roomAreaInput = roomDiv.querySelector(`input[name="room${rnum}_area"]`);
    const checkedAppliances = Array.from(roomDiv.querySelectorAll('input[name$="_appliance"]:checked')).map(x => x.value);
    const applianceData = {};
    checkedAppliances.forEach(appKey => {
      const tbody = roomDiv.querySelector(`#applianceRows_${appKey}_${rnum}`);
      const rows = [];
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(tr => {
          const rowData = {};
          tr.querySelectorAll('input,select').forEach(input => {
            rowData[input.name] = input.value;
          });
          rows.push(rowData);
        });
      }
      applianceData[appKey] = rows;
    });
    applianceRooms.push({
      roomType: roomSelect.value,
      roomArea: roomAreaInput ? roomAreaInput.value : "",
      appliances: checkedAppliances,
      applianceData
    });
  });
  json.applianceRooms = applianceRooms;

  const blob = new Blob([JSON.stringify(json, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "audit_submission_" + new Date().toISOString().replace(/:/g,'-').slice(0,19) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function clearForm() {
  document.getElementById('auditForm').reset();
  document.getElementById('applianceRooms').innerHTML = '';
  roomNumbers = [];
}

window.onload = function() { addRoom(); };
</script>
</body>
</html>
