<script>
const roomOptions = [
  "Room 1","Room 2","Room 3","Kitchen","Bathroom 1","Bathroom 2","Hall","Others"
];
const applianceList = [
  {key:'ac', label:'Air Conditioner'},
  {key:'refrigerator', label:'Refrigerator'},
  {key:'geyser', label:'Geyser / Water Heater'},
  {key:'washing_machine', label:'Washing Machine'},
  {key:'microwave', label:'Microwave / Cooktop'},
  {key:'fan', label:'Ceiling/Table Fans'},
  {key:'tv', label:'TV'},
  {key:'laptop', label:'Laptop/Computer'},
  {key:'lighting', label:'Lighting Fixtures (LED/CFL/Tube)'},
];
let roomCount = 0;

// Adds a new room section
function addRoom() {
  roomCount++;
  const roomDiv = document.createElement('div');
  roomDiv.classList.add('room-section');
  roomDiv.id = `room-section-${roomCount}`;
  let roomOptionsHtml = roomOptions.map(r => `<option value="${r}">${r}</option>`).join('');
  let applianceCheckboxesHtml = applianceList.map(app =>
    `<div class="form-check form-check-inline mb-2">
      <input class="form-check-input"
        type="checkbox"
        id="appliance-${app.key}-room${roomCount}"
        name="room${roomCount}_appliance"
        value="${app.key}"
        onchange="toggleApplianceConfigTable('${app.key}',${roomCount},this)">
      <label class="form-check-label" for="appliance-${app.key}-room${roomCount}">${app.label}</label>
    </div>`
  ).join(' ');
  roomDiv.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h5 class="mb-0">Room</h5>
      <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRoom(${roomCount})">Remove Room</button>
    </div>
    <div class="mb-2">
      <label class="form-label">Select Room</label>
      <select class="form-select mb-2" name="room${roomCount}_type" required>
        <option value="">-- Select --</option>
        ${roomOptionsHtml}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Select Appliances Present in This Room</label>
      <div>${applianceCheckboxesHtml}</div>
    </div>
    <div id="room${roomCount}_applianceTables"></div>
  `;
  document.getElementById('applianceRooms').appendChild(roomDiv);
}
function removeRoom(roomId) {
  let el = document.getElementById(`room-section-${roomId}`);
  if (el) el.remove();
}
function toggleApplianceConfigTable(appKey, roomId, checkbox) {
  let targetDiv = document.getElementById(`applianceTable_${appKey}_room${roomId}`);
  if (checkbox.checked) {
    if (!targetDiv) {
      let tablesDiv = document.getElementById(`room${roomId}_applianceTables`);
      let tableHtml = buildApplianceTable(appKey, roomId);
      tablesDiv.insertAdjacentHTML('beforeend', tableHtml);
      addApplianceRow(appKey, roomId);
    }
  } else {
    if (targetDiv) targetDiv.remove();
  }
}
function buildApplianceTable(appKey, roomId) {
  let appliance = applianceList.find(a => a.key === appKey);
  return `
    <div id="applianceTable_${appKey}_room${roomId}" class="appliance-table mt-3">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <b>${appliance.label}</b>
        <button class="btn btn-sm btn-outline-success" type="button" onclick="addApplianceRow('${appKey}',${roomId})">+ Add Row</button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered appliance-config-table mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:70px;">Qty</th>
              <th style="width:120px;">Power (W)</th>
              <th>Model/Type</th>
              <th style="width:110px;">Usage Hrs/Day</th>
              <th style="width:120px;">Time Start</th>
              <th style="width:120px;">Time End</th>
              <th style="width:130px;">Age/Condition</th>
              <th style="width:52px;"></th>
            </tr>
          </thead>
          <tbody id="applianceRows_${appKey}_room${roomId}"></tbody>
        </table>
      </div>
    </div>
  `;
}
function addApplianceRow(appKey, roomId) {
  let tbody = document.getElementById(`applianceRows_${appKey}_room${roomId}`);
  let idx = tbody ? tbody.children.length : 0;
  if (!tbody) return;
  let rowHtml = `
    <tr>
      <td><input type="number" min="1" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][qty]" value="1" required></td>
      <td><input type="number" min="1" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][power]" required></td>
      <td><input type="text" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][model]" required></td>
      <td><input type="number" min="0" max="24" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][usagehrs]" required></td>
      <td><input type="time" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][time_start]" required></td>
      <td><input type="time" class="form-control form-control-sm" name="room${roomId}_${appKey}[${idx}][time_end]" required></td>
      <td>
        <select class="form-select form-select-sm" name="room${roomId}_${appKey}[${idx}][age]" required>
          <option>New</option>
          <option>Good</option>
          <option>Average</option>
          <option>Old</option>
          <option>Not Working</option>
        </select>
      </td>
      <td>
        <button type="button" class="remove-row-btn" onclick="this.closest('tr').remove();" title="Remove Row">&times;</button>
      </td>
    </tr>
  `;
  tbody.insertAdjacentHTML('beforeend', rowHtml);
}

// --- FORM SUBMIT (AJAX POST to backend) ---
document.getElementById('auditForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const json = {};
  // Main fields
  formData.forEach((val, key) => {
    if (json[key]) { if (!Array.isArray(json[key])) json[key] = [json[key]]; json[key].push(val); }
    else { json[key] = val; }
  });
  // Appliance rooms + data
  const applianceRooms = [];
  document.querySelectorAll('.room-section').forEach((roomDiv, idx) => {
    const roomSelect = roomDiv.querySelector('select[name^="room"]');
    if (!roomSelect || !roomSelect.value) return;
    const roomType = roomSelect.value;
    const appliances = Array.from(roomDiv.querySelectorAll('input[type=checkbox][name$="_appliance"]:checked')).map(inp => inp.value);
    const appliancesData = {};
    appliances.forEach(appKey => {
      const rows = [];
      const tbody = roomDiv.querySelector(`#applianceRows_${appKey}_room${idx+1}`);
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(tr => {
          const row = {};
          tr.querySelectorAll('input,select').forEach(field => { row[field.name] = field.value; });
          rows.push(row);
        });
      }
      appliancesData[appKey] = rows;
    });
    applianceRooms.push({ roomType, appliances, appliancesData });
  });
  json['applianceRooms'] = applianceRooms;

  // --- POST to your deployed or localhost endpoint ---
  try {
    // For deployment, always use relative path!
    const resp = await fetch('/submit-audit', {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(json)
    });
    const result = await resp.json();
    if (result.status === 'success') {
      alert('Audit submitted successfully!');
      form.reset();
      document.getElementById('applianceRooms').innerHTML = '';
    } else { alert('Submission failed.'); }
  } catch (err) {
    alert('Network/server error: ' + err.message);
  }
});
</script>
